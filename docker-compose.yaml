services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: release
      POSTGRES_PASSWORD: release
      POSTGRES_DB: releases
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U release -d releases"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://release:release@db:5432/releases}
      PORT: 4000
    ports:
      - "127.0.0.1:${PORT:-4000}:4000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
